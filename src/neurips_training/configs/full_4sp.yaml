# Canonical 4-species blend (paper "vitb_full" / "vitl_full" runs).

parquet:
  # Directory containing {train,val,test}/<split>-NNNNN.parquet (HF ConnectomeBench2, branch v2).
  # Override with --parquet-root. Download with scripts/training/download_dataset.py.
  path: /datasets/connectomebench2

filter:
  include_species: [mouse, fly, zebrafish, human]
  include_sample_types: [merge_edit, split_edit, adjacent_control, junction_control, synapse_control]

blend:
  strategy: sqrt          # natural | uniform_species | uniform_type | uniform_cell | sqrt | custom
  cell_axis: kind         # kind (edits/junction/synapse) | sample_type (5-cell)
  # Paper App. B.2: "multiplied by the per-archive weight (mouse and human edits
  # 1.0, fly 0.7, zebrafish 0.5; junction and synapse archives 1.0)".
  weights:
    - {species: fly,       cell: edits, weight: 0.7}
    - {species: zebrafish, cell: edits, weight: 0.5}

# Invert per-task class frequency (paper: "Sample weights are additionally
# inverted by per-task class frequency").
class_balance: true
